<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konsep Logo SIPERMINDA</title>
  <style>
    :root { color: #063d61; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #fff; }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 48px; }
    h1 { margin: 0; font-size: 28px; }
    p { color: #6b7280; margin: 8px 0 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    figure { margin: 0; border: 1px solid #dbe7ee; border-radius: 10px; overflow: hidden; background: #fff; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px 16px 15px; font-size: 14px; font-weight: 700; }
    figcaption span { display: block; color: #6b7280; font-size: 12px; font-weight: 400; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Konsep Logo SIPERMINDA</h1>
    <p>Lima arah visual untuk Sistem Informasi Permintaan Data. Semua konsep dibuat sebagai vector flat dengan latar putih.</p>
    <section class="grid" aria-label="Lima konsep logo">
      <figure><img src="images/logo-concept-1-monogram-s.svg" alt="Konsep 1 monogram S"><figcaption>01. Monogram S<span>Ramah, mudah diingat, dan terasa personal.</span></figcaption></figure>
      <figure><img src="images/logo-concept-2-monogram-sp.svg" alt="Konsep 2 monogram SP"><figcaption>02. Monogram SP<span>Formal dan kuat untuk identitas institusi.</span></figcaption></figure>
      <figure><img src="images/logo-concept-3-data-service.svg" alt="Konsep 3 data dan layanan"><figcaption>03. Data dan layanan<span>Balon layanan dengan jaringan data.</span></figcaption></figure>
      <figure><img src="images/logo-concept-4-request-flow.svg" alt="Konsep 4 alur permintaan"><figcaption>04. Request to delivery<span>Memvisualkan permintaan, proses, dan hasil.</span></figcaption></figure>
      <figure><img src="images/logo-concept-5-geometric.svg" alt="Konsep 5 geometris"><figcaption>05. Geometris minimalis<span>Stabil, scalable, dan cocok untuk ikon aplikasi.</span></figcaption></figure>
    </section>
  </main>
</body>
</html>
